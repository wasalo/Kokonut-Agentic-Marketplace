name: Production Deployment

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'both'
        type: choice
        options:
          - docker
          - ipfs
          - both
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false

env:
  FOUNDRY_PROFILE: ci
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  PRODUCTION_SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
  PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
  IPFS_PROJECT_ID: ${{ secrets.IPFS_PROJECT_ID }}
  IPFS_PROJECT_SECRET: ${{ secrets.IPFS_PROJECT_SECRET }}

jobs:
  # ============================================
  # Determine if this is a tag push or manual
  # ============================================
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=main-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Secret Scanning
  # ============================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks_$(uname -s)_$(uname -m).tar.gz | tar -xz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --exit-code 1

  # ============================================
  # Smart Contract Tests
  # ============================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2026-03-22

      - name: Forge build
        run: forge build --sizes

      - name: Forge tests
        run: forge test -vvv

      - name: Coverage report
        run: forge coverage --report summary

      - name: Check coverage threshold
        run: |
          SUMMARY=$(forge coverage --report summary)
          TOTAL_LINE=$(echo "$SUMMARY" | grep "^Total" || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            COVERAGE=$(echo "$TOTAL_LINE" | awk '{print $4}' | tr -d '%')
            echo "Total coverage: ${COVERAGE}%"
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" -lt 80 ]; then
              echo "Error: Coverage ${COVERAGE}% is below threshold of 80%"
              exit 1
            fi
          fi

  # ============================================
  # Gas Benchmarking
  # ============================================
  gas-benchmark:
    name: Gas Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2026-03-22

      - name: Run gas benchmarks
        run: forge test --match-contract GasBenchmark -vvv

  # ============================================
  # Fuzzing Tests
  # ============================================
  fuzz-tests:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2026-03-22

      - name: Run fuzz tests
        run: forge test --match-contract Fuzz -vvv --fuzz-runs 10000

  # ============================================
  # Frontend Build
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run type-check

      - name: ESLint
        run: pnpm run lint

      - name: Next.js build
        run: pnpm --filter @kokonut/web build
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/web/.next
          retention-days: 7

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build application
        run: pnpm --filter @kokonut/web build

      - name: Run E2E tests
        run: pnpm --filter @kokonut/web test:e2e
        env:
          CI: true

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level high

  # ============================================
  # Deploy to Production (Docker)
  # ============================================
  deploy-docker:
    name: Deploy Docker to Production
    runs-on: ubuntu-latest
    needs: [prepare, contracts, frontend, e2e, security]
    if: |
      github.event.inputs.deploy_type == 'docker' ||
      github.event.inputs.deploy_type == 'both' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/web/.next

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/kokonut-marketplace:latest
            ${{ env.DOCKER_REGISTRY }}/kokonut-marketplace:${{ needs.prepare.outputs.version }}
          build-args: |
            NEXT_PUBLIC_DEPLOY_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ env.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/kokonut-production
            docker pull ${{ env.DOCKER_REGISTRY }}/kokonut-marketplace:${{ needs.prepare.outputs.version }}
            docker-compose down
            docker-compose up -d
            echo "Docker production deployment complete"

      - name: Create GitHub Release
        if: needs.prepare.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Kokonut v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Deploy to IPFS (Decentralized)
  # ============================================
  deploy-ipfs:
    name: Deploy to IPFS
    runs-on: ubuntu-latest
    needs: [prepare, contracts, frontend]
    if: |
      github.event.inputs.deploy_type == 'ipfs' ||
      github.event.inputs.deploy_type == 'both' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/web/.next

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install IPFS HTTP Client
        run: npm install -g ipfs-http-client

      - name: Upload to IPFS via Pinata
        run: |
          npm install -g @pinata/cli
          pinata upload ./apps/web/out \
            --name "kokonut-production-${{ needs.prepare.outputs.version }}" \
            --gateway https://gateway.pinata.cloud/ipfs/
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}

      - name: Create DNS record for IPFS (if using ENS)
        run: |
          echo "To link IPFS to ENS domain:"
          echo "1. Copy the IPFS hash from the previous step"
          echo "2. Update the ENS text record for 'ipfs.nft' or 'contenthash'"
          echo "See: https://docs.ens.domains/developer-guide/resolving-names"

      - name: Create GitHub Release with IPFS info
        if: needs.prepare.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Kokonut v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Notify Deployment Complete
  # ============================================
  notify:
    name: Notify Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-docker, deploy-ipfs]
    if: always()
    steps:
      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
          custom_payload: |
            {
              "text": "🚀 Production deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment ${{ job.status }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.prepare.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
