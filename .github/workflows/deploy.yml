name: Production Deployment

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'both'
        type: choice
        options:
          - docker
          - ipfs
          - both
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false

env:
  FOUNDRY_PROFILE: ci
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ============================================
  # Determine if this is a tag push or manual
  # ============================================
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            SAFE_VERSION=$(echo "${{ github.event.inputs.version }}" | sed 's/[^a-zA-Z0-9._-]//g')
            echo "version=$SAFE_VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SAFE_VERSION=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]//g')
            echo "version=$SAFE_VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=main-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Smart Contract Tests
  # ============================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Forge build
        run: forge build --sizes --via-ir

      - name: Forge tests
        run: forge test -vvv --via-ir

      - name: Coverage report
        run: forge coverage --report summary --ir-minimum

      - name: Check coverage threshold
        run: |
          SUMMARY=$(forge coverage --report summary --ir-minimum)
          TOTAL_LINE=$(echo "$SUMMARY" | grep "^Total" || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            COVERAGE=$(echo "$TOTAL_LINE" | awk '{print $4}' | tr -d '%')
            echo "Total coverage: ${COVERAGE}%"
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" -lt 80 ]; then
              echo "Error: Coverage ${COVERAGE}% is below threshold of 80%"
              exit 1
            fi
          fi

  # ============================================
  # Gas Benchmarking
  # ============================================
  gas-benchmark:
    name: Gas Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Run gas benchmarks
        run: forge test --match-contract GasBenchmark -vvv --via-ir

  # ============================================
  # Fuzzing Tests
  # ============================================
  fuzz-tests:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Run fuzz tests
        run: forge test --match-contract Fuzz -vvv --fuzz-runs 10000 --via-ir

  # ============================================
  # Frontend Build
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run type-check

      - name: ESLint
        run: pnpm run lint

      - name: Next.js build
        run: pnpm --filter @kokonut/web build
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-build
          path: apps/web/.next
          retention-days: 7

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build application
        run: pnpm --filter @kokonut/web build

      - name: Run E2E tests
        run: pnpm --filter @kokonut/web test:e2e
        env:
          CI: true

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level critical

      - name: Secret scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --results=verified,unknown

  # ============================================
  # Production Approval Gate
  # ============================================
  deploy_approval:
    name: Approve Production Deploy
    runs-on: ubuntu-latest
    needs: [prepare, contracts, frontend, e2e, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - run: echo "Production deployment approved"

  # ============================================
  # Deploy to Production (Docker)
  # ============================================
  deploy-docker:
    name: Deploy Docker to Production
    runs-on: ubuntu-latest
    needs: [prepare, contracts, frontend, e2e, security, deploy_approval]
    permissions:
      contents: write
    if: |
      github.event.inputs.deploy_type == 'docker' ||
      github.event.inputs.deploy_type == 'both' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-build
          path: apps/web/.next

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/kokonut-marketplace:latest
            ${{ secrets.DOCKER_REGISTRY }}/kokonut-marketplace:${{ needs.prepare.outputs.version }}
          build-args: |
            NEXT_PUBLIC_DEPLOY_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/kokonut-production
            docker pull ${{ secrets.DOCKER_REGISTRY }}/kokonut-marketplace:${{ needs.prepare.outputs.version }}
            docker-compose down
            docker-compose up -d
            echo "Docker production deployment complete"

      - name: Create GitHub Release
        if: needs.prepare.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1.2.0
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Kokonut v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Deploy to IPFS (Decentralized)
  # ============================================
  deploy-ipfs:
    name: Deploy to IPFS
    runs-on: ubuntu-latest
    needs: [prepare, contracts, frontend, e2e, security, deploy_approval]
    permissions:
      contents: write
    if: |
      github.event.inputs.deploy_type == 'ipfs' ||
      github.event.inputs.deploy_type == 'both' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-build
          path: apps/web/.next

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install IPFS HTTP Client
        run: npm install -g ipfs-http-client

      - name: Upload to IPFS via Pinata
        run: |
          npm install -g @pinata/cli
          pinata upload ./apps/web/out \
            --name "kokonut-production-${{ needs.prepare.outputs.version }}" \
            --gateway https://gateway.pinata.cloud/ipfs/
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}

      - name: Create DNS record for IPFS (if using ENS)
        run: |
          echo "To link IPFS to ENS domain:"
          echo "1. Copy the IPFS hash from the previous step"
          echo "2. Update the ENS text record for 'ipfs.nft' or 'contenthash'"
          echo "See: https://docs.ens.domains/developer-guide/resolving-names"

      - name: Create GitHub Release with IPFS info
        if: needs.prepare.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1.2.0
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Kokonut v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Notify Deployment Complete
  # ============================================
  notify:
    name: Notify Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-docker, deploy-ipfs]
    if: always()
    steps:
      - name: Send deployment notification
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
          custom_payload: |
            {
              "text": "🚀 Production deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment ${{ job.status }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.prepare.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
