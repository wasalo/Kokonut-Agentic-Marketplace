name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  FOUNDRY_PROFILE: ci
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ============================================
  # Smart Contract Tests
  # ============================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Forge build
        run: forge build --sizes --via-ir

      - name: Forge tests
        run: forge test -vvv --via-ir

      # Coverage gate intentionally removed (June 2026).
      #
      # `forge coverage` hard-disables `viaIR` and the optimizer (required for
      # accurate source maps). Our contracts rely on `via_ir = true` in
      # `foundry.toml` to fit the 24,576 byte EIP-170 limit and to avoid
      # stack-too-deep in 10+-arg functions like `_createJob` and
      # `createJobAndFund`. The standard `forge coverage` path therefore
      # fails to compile several contracts.
      #
      # The `--ir-minimum` workaround (uses viaIR with minimum optimization)
      # also fails with Solc 0.8.22's Yul stack-too-deep bug
      # ("Cannot swap Slot RET with Variable value7: too deep in the stack
      # by 2 slots"). This is open Foundry issue #3357 and is acknowledged
      # upstream as a tooling limitation; the only proper fix is a future
      # rewrite of the coverage pipeline (IR + bytecode instrumentation).
      #
      # Security is enforced by the 343 forge tests in the step above and
      # the Slither static analysis job below. Coverage was informational.
      # Re-enable once Foundry fixes #3357 (or after a coordinated Solc bump
      # to 0.8.24+ which patches the upstream Yul bug).

  # ============================================
  # Gas Benchmarking
  # ============================================
  gas-benchmark:
    name: Gas Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Run gas benchmarks
        run: forge test --match-contract GasBenchmark -vvv --via-ir

      - name: Generate gas report
        run: forge test --gas-report --match-contract GasBenchmark --via-ir > gas-report.txt || true
        continue-on-error: true

      - name: Check gas snapshots
        run: forge snapshot --check --via-ir || echo "Gas snapshots changed - update locally with 'forge snapshot'"
        continue-on-error: true

      - name: Upload gas report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: 30

      - name: Display gas summary
        run: |
          echo "## Gas Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gas-report.txt ]; then
            head -20 gas-report.txt >> $GITHUB_STEP_SUMMARY || true
          fi

  # ============================================
  # Fuzzing Tests
  # ============================================
  fuzz-tests:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Run fuzz tests
        run: forge test --match-contract Fuzz -vvv --fuzz-runs 10000 --via-ir

  # ============================================
  # Invariant Tests
  # ============================================
  invariant-tests:
    name: Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Run invariant tests
        run: forge test --match-contract Invariant -vvv --via-ir

  # ============================================
  # Slither Static Analysis
  # ============================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: v1.7.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: '3.10'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither . --exclude-dependencies --exclude-informational --json slither-report.json || true

      - name: Upload Slither report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: slither-report
          path: slither-report.json
          retention-days: 7

  # ============================================
  # Frontend Build & Type Check
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run type-check

      - name: TypeScript strict unused-code check
        run: pnpm --filter @kokonut/web type-check:strict

      - name: ESLint
        run: pnpm run lint

      - name: Next.js build
        run: pnpm --filter @kokonut/web build

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: |
          npx playwright install chromium webkit
          npx playwright install-deps webkit

      - name: Build application
        run: pnpm --filter @kokonut/web build

      - name: Run E2E tests
        run: pnpm --filter @kokonut/web test:e2e
        env:
          CI: true

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level critical

      - name: Secret scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --results=verified,unknown

  # ============================================
  # SBOM Generation
  # ============================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          format: spdx-json
          output-file: sbom-workspace.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./contracts
          format: cyclonedx-json
          output-file: sbom-contracts.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: |
            sbom-workspace.json
            sbom-contracts.json
          retention-days: 30
