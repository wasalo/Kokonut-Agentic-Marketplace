name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  FOUNDRY_PROFILE: ci
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Smart Contract Tests
  # ============================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge build
        run: forge build --sizes --via-ir

      - name: Forge tests
        run: forge test -vvv --via-ir

      - name: Coverage report
        run: forge coverage --report summary --ir-minimum

      - name: Check coverage threshold
        run: |
          SUMMARY=$(forge coverage --report summary --ir-minimum)
          echo "$SUMMARY"
          # Extract total coverage percentage using grep and awk
          TOTAL_LINE=$(echo "$SUMMARY" | grep "^Total" || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            COVERAGE=$(echo "$TOTAL_LINE" | awk '{print $4}' | tr -d '%')
            echo "Total coverage: ${COVERAGE}%"
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" -lt 80 ]; then
              echo "Error: Coverage ${COVERAGE}% is below threshold of 80%"
              exit 1
            fi
          fi

  # ============================================
  # Gas Benchmarking
  # ============================================
  gas-benchmark:
    name: Gas Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run gas benchmarks
        run: forge test --match-contract GasBenchmark -vvv --via-ir

      - name: Generate gas report
        run: forge test --gas-report --match-contract GasBenchmark --via-ir > gas-report.txt || true
        continue-on-error: true

      - name: Check gas snapshots
        run: forge snapshot --check --via-ir || echo "Gas snapshots changed - update locally with 'forge snapshot'"
        continue-on-error: true

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: 30

      - name: Display gas summary
        run: |
          echo "## Gas Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gas-report.txt ]; then
            head -20 gas-report.txt >> $GITHUB_STEP_SUMMARY || true
          fi

  # ============================================
  # Fuzzing Tests
  # ============================================
  fuzz-tests:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run fuzz tests
        run: forge test --match-contract Fuzz -vvv --fuzz-runs 10000 --via-ir

  # ============================================
  # Invariant Tests
  # ============================================
  invariant-tests:
    name: Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run invariant tests
        run: forge test --match-contract Invariant -vvv --via-ir

  # ============================================
  # Slither Static Analysis
  # ============================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither . --exclude-dependencies --exclude-informational --json slither-report.json
        continue-on-error: true

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: slither-report.json
          retention-days: 7

  # ============================================
  # Frontend Build & Type Check
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run type-check

      - name: TypeScript strict unused-code check
        run: pnpm --filter @kokonut/web type-check:strict

      - name: ESLint
        run: pnpm run lint

      - name: Next.js build
        run: pnpm --filter @kokonut/web build

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: |
          npx playwright install chromium webkit
          npx playwright install-deps webkit

      - name: Build application
        run: pnpm --filter @kokonut/web build

      - name: Run E2E tests
        run: pnpm --filter @kokonut/web test:e2e
        env:
          CI: true

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level critical
