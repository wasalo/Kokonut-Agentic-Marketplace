name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FOUNDRY_PROFILE: ci
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Smart Contract Tests
  # ============================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge build
        run: forge build --sizes

      - name: Forge tests
        run: forge test -vvv

      - name: Coverage report
        run: forge coverage --report summary

      - name: Check coverage threshold
        run: |
          SUMMARY=$(forge coverage --report summary)
          echo "$SUMMARY"
          # Extract total coverage percentage using grep and awk
          TOTAL_LINE=$(echo "$SUMMARY" | grep "^Total" || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            COVERAGE=$(echo "$TOTAL_LINE" | awk '{print $4}' | tr -d '%')
            echo "Total coverage: ${COVERAGE}%"
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" -lt 80 ]; then
              echo "Error: Coverage ${COVERAGE}% is below threshold of 80%"
              exit 1
            fi
          fi

  # ============================================
  # Gas Benchmarking
  # ============================================
  gas-benchmark:
    name: Gas Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run gas benchmarks
        run: forge test --match-contract GasBenchmark -vvv

      - name: Check gas snapshots
        run: forge snapshot --check || echo "Gas snapshots changed - update locally with 'forge snapshot'"
        continue-on-error: true

  # ============================================
  # Fuzzing Tests
  # ============================================
  fuzz-tests:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run fuzz tests
        run: forge test --match-contract Fuzz -vvv --fuzz-runs 10000

  # ============================================
  # Invariant Tests
  # ============================================
  invariant-tests:
    name: Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run invariant tests
        run: forge test --match-contract Invariant -vvv

  # ============================================
  # Frontend Build & Type Check
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        run: npm run build --workspace=apps/web

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build application
        run: npm run build --workspace=apps/web

      - name: Run E2E tests
        run: npm run test:e2e --workspace=apps/web
        env:
          CI: true

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check lockfile integrity
        run: npm ci --package-lock-only
