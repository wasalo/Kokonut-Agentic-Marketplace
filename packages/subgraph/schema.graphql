type Agent @entity(immutable: false) {
  id: ID!
  agentId: BigInt!
  owner: Bytes!
  metadataURI: String
  name: String
  description: String
  capabilities: [String!]
  source: String
  isActive: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!
  services: [Service!] @derivedFrom(field: "agent")
  skills: [Skill!] @derivedFrom(field: "agent")
  blacklisted: Boolean
  featured: Boolean
}

type Review @entity(immutable: true) {
  id: ID!
  agent: Bytes!
  reviewer: Bytes!
  rating: Int!
  feedbackId: BigInt!
  timestamp: BigInt!
}

type Service @entity(immutable: false) {
  id: ID!
  serviceId: BigInt!
  agent: Agent!
  provider: Bytes!
  name: String!
  description: String
  metadataURI: String
  price: BigInt!
  paymentToken: Bytes
  paymentAddress: Bytes
  isActive: Boolean!
  createdAt: BigInt!
  bond: BigInt
}

type Job @entity(immutable: false) {
  id: ID!
  jobId: BigInt!
  client: Bytes!
  provider: Bytes
  evaluator: Bytes
  serviceId: BigInt
  paymentToken: Bytes
  description: String
  budget: BigInt!
  expiredAt: BigInt!
  status: Int!
  hook: Bytes
  createdAt: BigInt!
  fundedAt: BigInt
  submittedAt: BigInt
  completedAt: BigInt
  rejectedAt: BigInt
  deliverable: Bytes
  platformFee: BigInt
  evaluatorFee: BigInt
}

type Skill @entity(immutable: false) {
  id: ID!
  skillId: BigInt!
  agent: Agent!
  name: String
  isActive: Boolean!
  createdAt: BigInt!
}

type Milestone @entity(immutable: false) {
  id: ID!
  jobId: BigInt!
  milestoneIndex: BigInt!
  description: String
  amount: BigInt!
  status: Int!
  createdAt: BigInt!
  completedAt: BigInt
}

type Dispute @entity(immutable: false) {
  id: ID!
  jobId: BigInt!
  milestoneIndex: BigInt!
  flagger: Bytes!
  arbiter: Bytes
  token: Bytes
  feePaid: BigInt
  releasedToProvider: Boolean
  arbiterFee: BigInt
  resolved: Boolean!
  createdAt: BigInt!
  resolvedAt: BigInt
}

type Activity @entity(immutable: true) {
  id: ID!
  type: String!
  actor: Bytes!
  targetId: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  metadata: String
}

type BlacklistEntry @entity(immutable: false) {
  id: ID!
  agentId: BigInt
  wallet: Bytes
  reason: String
  blacklistedBy: Bytes
  blacklistedAt: BigInt!
  activationAt: BigInt!
  active: Boolean!
}

type BiddingSession @entity(immutable: false) {
  id: ID!
  sessionId: BigInt!
  creator: Bytes!
  evaluator: Bytes!
  maxBudget: BigInt!
  deadline: BigInt!
  revealWindowEnd: BigInt
  serviceId: BigInt
  jobId: BigInt
  winner: Bytes
  winningBidId: BigInt
  jobCreated: Boolean!
  status: Int!
  useRandomEvaluator: Boolean
  paymentToken: Bytes
  createdAt: BigInt!
  updatedAt: BigInt!
  bids: [Bid!] @derivedFrom(field: "session")
}

type Bid @entity(immutable: true) {
  id: ID!
  bidId: BigInt!
  session: BiddingSession!
  bidder: Bytes!
  proposedAmount: BigInt
  stake: BigInt!
  commitHash: Bytes
  revealed: Boolean!
  accepted: Boolean!
  rejected: Boolean!
  stakeWithdrawn: Boolean!
  timestamp: BigInt!
}

type PlatformStat @entity(immutable: false) {
  id: ID!
  totalAgents: Int!
  totalActiveAgents: Int!
  totalServices: Int!
  totalJobs: Int!
  totalReviews: Int!
  totalSkills: Int!
  totalBlacklistedAgents: Int!
  totalDisputes: Int!
  updatedAt: BigInt!
}
