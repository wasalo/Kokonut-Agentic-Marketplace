type Agent @entity {
  id: ID!
  agentId: BigInt!
  owner: Bytes!
  metadataURI: String
  name: String
  description: String
  capabilities: [String!]
  source: String
  isActive: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!
  services: [Service!] @derivedFrom(field: "agent")
  skills: [Skill!] @derivedFrom(field: "agent")
  blacklisted: Boolean
  featured: Boolean
}

type Review @entity {
  id: ID!
  agent: Bytes!
  reviewer: Bytes!
  rating: Int!
  feedbackId: BigInt!
  timestamp: BigInt!
}

type Service @entity {
  id: ID!
  serviceId: BigInt!
  agent: Agent!
  provider: Bytes!
  name: String!
  description: String
  metadataURI: String
  price: BigInt!
  paymentToken: Bytes
  paymentAddress: Bytes
  isActive: Boolean!
  createdAt: BigInt!
  bond: BigInt
}

type Job @entity {
  id: ID!
  jobId: BigInt!
  client: Bytes!
  provider: Bytes
  evaluator: Bytes
  serviceId: BigInt
  paymentToken: Bytes
  description: String
  budget: BigInt!
  expiredAt: BigInt!
  status: Int!
  hook: Bytes
  createdAt: BigInt!
  fundedAt: BigInt
  submittedAt: BigInt
  completedAt: BigInt
  rejectedAt: BigInt
  deliverable: Bytes
  platformFee: BigInt
  evaluatorFee: BigInt
}

type Proposal @entity {
  id: ID!
  proposalId: BigInt!
  proposer: Bytes!
  title: String
  description: String
  reward: BigInt!
  status: Int!
  createdAt: BigInt!
  decidedAt: BigInt
  winningEvaluator: Bytes
  evaluations: [Evaluation!] @derivedFrom(field: "proposal")
}

type Evaluation @entity {
  id: ID!
  proposal: Proposal!
  evaluator: Bytes!
  confidenceScore: Int!
  reasoningURI: String
  createdAt: BigInt!
}

type Skill @entity {
  id: ID!
  skillId: BigInt!
  agent: Agent!
  name: String
  isActive: Boolean!
  createdAt: BigInt!
}

type Milestone @entity {
  id: ID!
  jobId: BigInt!
  milestoneIndex: BigInt!
  description: String
  amount: BigInt!
  status: Int!
  createdAt: BigInt!
  completedAt: BigInt
}

type Dispute @entity {
  id: ID!
  jobId: BigInt!
  milestoneIndex: BigInt!
  flagger: Bytes!
  arbiter: Bytes
  resolved: Boolean!
  createdAt: BigInt!
  resolvedAt: BigInt
}

type Activity @entity {
  id: ID!
  type: String!
  actor: Bytes!
  targetId: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  metadata: String
}

type BlacklistEntry @entity {
  id: ID!
  agentId: BigInt
  wallet: Bytes
  reason: String
  blacklistedBy: Bytes
  blacklistedAt: BigInt!
  activationAt: BigInt!
  active: Boolean!
}

type PlatformStat @entity {
  id: ID!
  totalAgents: Int!
  totalActiveAgents: Int!
  totalServices: Int!
  totalJobs: Int!
  totalProposals: Int!
  totalReviews: Int!
  totalSkills: Int!
  totalBlacklistedAgents: Int!
  totalDisputes: Int!
  updatedAt: BigInt!
}
