specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AgenticCommerce
    network: sepolia
    source:
      address: "0x3a1Bc03cC84040A282F6bf238b917D8351499239"
      abi: AgenticCommerce
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Job
        - Activity
        - PlatformStat
      abis:
        - name: AgenticCommerce
          file: ./abis/AgenticCommerce.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,address,uint256,uint256,bool,bool,bool)
          handler: handleJobCreated
        - event: JobFunded(indexed uint256,indexed address,uint256)
          handler: handleJobFunded
        - event: JobSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleJobSubmitted
        - event: JobStatusChanged(indexed uint256,indexed uint8,indexed uint8,address,uint256)
          handler: handleJobStatusChanged
        - event: PaymentReleased(indexed uint256,uint256,uint256,uint256)
          handler: handlePaymentReleased
        - event: JobRejected(indexed uint256,indexed address,bytes32)
          handler: handleJobRejected
        - event: JobCompleted(indexed uint256,indexed address,indexed address,uint256)
          handler: handleJobCompleted
      file: ./src/agentic-commerce.ts
  - kind: ethereum
    name: ServiceRegistry
    network: sepolia
    source:
      address: "0x62E1eeEa1A2Ab987004F35bDA430457Ed6077201"
      abi: ServiceRegistry
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Service
        - Activity
        - PlatformStat
      abis:
        - name: ServiceRegistry
          file: ./abis/ServiceRegistry.json
      eventHandlers:
        - event: ServiceCreated(indexed uint256,indexed address,indexed uint256,string,uint256)
          handler: handleServiceCreated
        - event: ServiceUpdated(indexed uint256)
          handler: handleServiceUpdated
        - event: ServiceDeactivated(indexed uint256)
          handler: handleServiceDeactivated
      file: ./src/service-registry.ts
  - kind: ethereum
    name: SkillRegistry
    network: sepolia
    source:
      address: "0xA84684261558f342d6871DD2CFef90A2117Aa20A"
      abi: SkillRegistry
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Skill
      abis:
        - name: SkillRegistry
          file: ./abis/SkillRegistry.json
      eventHandlers:
        - event: SkillRegistered(indexed uint256,indexed uint256,string,string,indexed address)
          handler: handleSkillRegistered
        - event: SkillDeactivated(indexed uint256,indexed address)
          handler: handleSkillDeactivated
      file: ./src/skill-registry.ts
  - kind: ethereum
    name: MilestoneEscrow
    network: sepolia
    source:
      address: "0xc89D63057288092012c5D3cEF66121C1F8449a9f"
      abi: MilestoneEscrow
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Milestone
        - Dispute
        - PlatformStat
      abis:
        - name: MilestoneEscrow
          file: ./abis/MilestoneEscrow.json
      eventHandlers:
        - event: MilestoneEnabled(indexed uint256)
          handler: handleMilestoneEnabled
        - event: MilestoneAdded(indexed uint256,indexed uint256,string,uint256)
          handler: handleMilestoneAdded
        - event: MilestoneCompleted(indexed uint256,indexed uint256,bytes32)
          handler: handleMilestoneCompleted
        - event: MilestoneReleased(indexed uint256,indexed uint256,uint256)
          handler: handleMilestoneReleased
        - event: DisputeFlagged(indexed uint256,indexed address,address,uint256)
          handler: handleDisputeFlagged
        - event: DisputeResolved(indexed uint256,bool,indexed address,address,uint256)
          handler: handleDisputeResolved
        - event: ArbiterRegistered(indexed address,address,uint256)
          handler: handleArbiterRegistered
        - event: ArbiterUnregistered(indexed address,address,uint256)
          handler: handleArbiterUnregistered
      file: ./src/milestone-escrow.ts
  - kind: ethereum
    name: AdminRegistry
    network: sepolia
    source:
      address: "0xC81C864CEAb6231ad764cf9867e031D8b6dee41d"
      abi: AdminRegistry
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BlacklistEntry
        - PlatformStat
      abis:
        - name: AdminRegistry
          file: ./abis/AdminRegistry.json
      eventHandlers:
        - event: AgentBlacklisted(indexed uint256,indexed address,string,uint256)
          handler: handleAgentBlacklisted
        - event: AgentUnblacklisted(indexed uint256,indexed address)
          handler: handleAgentUnblacklisted
        - event: WalletBlacklisted(indexed address,indexed address,string,uint256)
          handler: handleWalletBlacklisted
        - event: WalletUnblacklisted(indexed address,indexed address)
          handler: handleWalletUnblacklisted
        - event: FeaturedAgentUpdated(indexed uint256,bool)
          handler: handleFeaturedAgentUpdated
      file: ./src/admin-registry.ts
  - kind: ethereum
    name: ERC8004Registry
    network: sepolia
    source:
      address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      abi: ERC8004Registry
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
        - Activity
        - PlatformStat
      abis:
        - name: ERC8004Registry
          file: ./abis/ERC8004Registry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: AgentURIUpdated(indexed uint256,string)
          handler: handleAgentURIUpdated
        - event: MetadataUpdated(indexed uint256,string)
          handler: handleMetadataUpdated
      file: ./src/erc8004-identity.ts
  - kind: ethereum
    name: ERC8004Reputation
    network: sepolia
    source:
      address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
      abi: ERC8004Reputation
      startBlock: 9989393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Review
        - PlatformStat
      abis:
        - name: ERC8004Reputation
          file: ./abis/ERC8004Reputation.json
      eventHandlers:
        - event: FeedbackSubmitted(indexed uint256,indexed address,indexed address,int256)
          handler: handleFeedbackSubmitted
      file: ./src/erc8004-reputation.ts
