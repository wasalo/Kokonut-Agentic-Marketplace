[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokonut"
version = "0.1.0"
description = "Python SDK for the Kokonut Agent Economy Stack"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Kokonut Team", email = "team@kokonut.dev" }
]
keywords = ["ethereum", "web3", "agent", "economy", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "web3>=6.0.0",
    "eth-abi>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/kokonut/agent-economy-stack"
Documentation = "https://github.com/kokonut/agent-economy-stack/blob/main/docs/AGENT_SDK.md"

[tool.hatch.build.targets.wheel]
packages = ["kokonut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
